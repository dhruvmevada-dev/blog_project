{% extends 'base.html' %}
{% block title %}Sign Up{% endblock %}

{% block content %}
<h2>Sign Up</h2>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-primary">Create Account</button>
</form>
<p class="mt-3">Already registered? <a href="{% url 'login' %}">Login</a></p>
{% endblock %}
